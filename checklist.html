.card{

  border:1px solid var(--line); border-radius:16px; overflow:hidden;

}
.card.in-view{ opacity:1; transform:none; }

.card-head{
  display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.card-icon{
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  background:rgba(201,162,75,.14); display:flex; align-items:center; justify-content:center;

}
.card-title{ flex:1; font-size:14.5px; font-weight:700; }
.card-chevron{ color:var(--gold); transition:transform .35s ease; font-size:13px; }
.card.open .card-chevron{ transform:rotate(180deg); }

.card-body-wrap{ max-height:0; overflow:hidden; transition:max-height .5s ease; }
.card.open .card-body-wrap{ max-height:2000px; }

.card-body{ padding:0 18px 18px; }
.card-body ul{ list-style:none; display:flex; flex-direction:column; gap:9px; margin-bottom:14px; }
.card-body ul li{

.card-body ul li::before{

}

const CANVAS_WIDTH = 720;
const PADDING = 44;
const COLORS = {
  bg1:'#0B1B33', bg2:'#132846', gold:'#C9A24B', goldBright:'#E4C878',
  cream:'#F7F3EA', line:'rgba(201,162,75,0.35)'
};
const FONT_TITLE = '800 22px Vazirmatn, Tahoma, sans-serif';
const FONT_ITEM  = '400 15px Vazirmatn, Tahoma, sans-serif';
const FONT_EX    = '500 14px Vazirmatn, Tahoma, sans-serif';
const FONT_COVER = '800 26px Vazirmatn, Tahoma, sans-serif';

function wrapLines(ctx, text, maxWidth){
  const words = text.split(' ');
  let lines = [], current = '';
  words.forEach(w => {
    const test = current ? current + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function layoutSection(mctx, section, maxWidth){
  const cmds = [];
  let h = 0;
  mctx.font = FONT_TITLE;
  wrapLines(mctx, section.title, maxWidth).forEach(line => {
    h += 30; cmds.push({ type:'title', text:line, y:h });
  });
  h += 10;
  cmds.push({ type:'divider', y:h });
  h += 26;
  mctx.font = FONT_ITEM;
  section.items.forEach(item => {
    wrapLines(mctx, '◆  ' + item, maxWidth - 6).forEach(line => {
      h += 25; cmds.push({ type:'item', text:line, y:h });
    });
    h += 6;
  });
  if (section.example){
    h += 10;
    cmds.push({ type:'example', text:section.example, boxTop:h });
    h += 56;
  }
  h += 26;
  return { cmds, height:h };
}

async function buildCanvasForSections(sections, coverTitle){
  await document.fonts.ready;
  const maxWidth = CANVAS_WIDTH - PADDING*2;

  const tmp = document.createElement('canvas');
  tmp.width = CANVAS_WIDTH; tmp.height = 10;
  const mctx = tmp.getContext('2d');
  mctx.direction = 'rtl'; mctx.textAlign = 'right';

  let totalHeight = PADDING;
  let coverLines = [];
  if (coverTitle){
    mctx.font = FONT_COVER;
    coverLines = wrapLines(mctx, coverTitle, maxWidth);
    totalHeight += coverLines.length * 34 + 20;
  }

  const layouts = sections.map(s => {
    const startY = totalHeight;
    const { cmds, height } = layoutSection(mctx, s, maxWidth);
    totalHeight += height;
    return { cmds, startY };
  });
  totalHeight += PADDING + 30;

  const canvas = document.createElement('canvas');
  canvas.width = CANVAS_WIDTH;
  canvas.height = Math.ceil(totalHeight);
  const ctx = canvas.getContext('2d');
  ctx.direction = 'rtl'; ctx.textAlign = 'right';

  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, COLORS.bg2); grad.addColorStop(1, COLORS.bg1);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = COLORS.gold; ctx.fillRect(0, 0, canvas.width, 6);

  let y = PADDING;
  if (coverTitle){
    ctx.font = FONT_COVER; ctx.fillStyle = COLORS.goldBright;
    coverLines.forEach(line => { y += 34; ctx.fillText(line, CANVAS_WIDTH - PADDING, y); });
  }

  layouts.forEach(({ cmds, startY }) => {
    cmds.forEach(cmd => {
      if (cmd.type === 'title'){
        ctx.font = FONT_TITLE; ctx.fillStyle = COLORS.cream;
        ctx.fillText(cmd.text, CANVAS_WIDTH - PADDING, startY + cmd.y);
      } else if (cmd.type === 'divider'){
        ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(PADDING, startY + cmd.y);
        ctx.lineTo(CANVAS_WIDTH - PADDING, startY + cmd.y);
        ctx.stroke();
      } else if (cmd.type === 'item'){
        ctx.font = FONT_ITEM; ctx.fillStyle = 'rgba(247,243,234,.88)';
        ctx.fillText(cmd.text, CANVAS_WIDTH - PADDING, startY + cmd.y);
      } else if (cmd.type === 'example'){
        const boxTop = startY + cmd.boxTop;
        ctx.fillStyle = 'rgba(0,0,0,.22)';
        roundRect(ctx, PADDING, boxTop, maxWidth, 46, 10); ctx.fill();
        ctx.strokeStyle = COLORS.line;
        roundRect(ctx, PADDING, boxTop, maxWidth, 46, 10); ctx.stroke();
        ctx.direction = 'ltr'; ctx.textAlign = 'center';
        ctx.fillStyle = COLORS.goldBright; ctx.font = FONT_EX;
        ctx.fillText(cmd.text, CANVAS_WIDTH/2, boxTop + 29);
        ctx.direction = 'rtl'; ctx.textAlign = 'right';
      }
    });
  });

  ctx.direction = 'rtl'; ctx.textAlign = 'center';
  ctx.font = '500 13px Vazirmatn, Tahoma, sans-serif';
  ctx.fillStyle = 'rgba(247,243,234,.5)';
  ctx.fillText('استودیو رونا', CANVAS_WIDTH/2, canvas.height - 18);

  return canvas;
}

function downloadCanvasAsImage(canvas, filename){
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }, 'image/png');
}

function safeName(text){
  return text.replace(/[^a-zA-Z0-9آ-ی\s]/g, '').trim().slice(0, 40);
}

const wrap = document.getElementById('cardsWrap');

SECTIONS.forEach((s, idx) => {
  const card = document.createElement('div');
  card.className = 'card';

  const itemsHtml = s.items.map(t => `<li>${t}</li>`).join('');
  const exampleHtml = s.example ? `<div class="example">${s.example}</div>` : '';

  card.innerHTML = `
    <div class="card-head">
      <div class="card-icon"><i class="fa-solid ${s.icon}"></i></div>
      <div class="card-title">${s.title}</div>
      <i class="fa-solid fa-chevron-down card-chevron"></i>
    </div>
    <div class="card-body-wrap">
      <div class="card-body">
        <ul>${itemsHtml}</ul>
        ${exampleHtml}
        <button class="dl-btn" data-idx="${idx}">
          <i class="fa-solid fa-image"></i>
          دانلود این بخش (عکس)
        </button>
      </div>
    </div>
  `;

  card.querySelector('.card-head').addEventListener('click', () => {
    card.classList.toggle('open');
  });

  card.querySelector('.dl-btn').addEventListener('click', async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ساخت...';
    const canvas = await buildCanvasForSections([s], null);
    downloadCanvasAsImage(canvas, safeName(s.title) + '.png');
    btn.innerHTML = originalHtml;
  });

  wrap.appendChild(card);
});

const downloadAllWrap = document.createElement('div');
downloadAllWrap.style.textAlign = 'center';
downloadAllWrap.style.marginTop = '10px';
downloadAllWrap.innerHTML = `
  <button class="dl-btn" id="downloadAllBtn" style="padding:14px 26px; font-size:14px;">
    <i class="fa-solid fa-images"></i>
    دانلود همه‌ی نکات (یک عکس کامل)
  </button>
`;
wrap.appendChild(downloadAllWrap);

document.getElementById('downloadAllBtn').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال ساخت عکس کامل...';
  const canvas = await buildCanvasForSections(SECTIONS, 'چک‌لیست کامل روز عروسی');
  downloadCanvasAsImage(canvas, 'چک‌لیست-روز-عروسی-رونا.png');
  btn.innerHTML = originalHtml;
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('.card').forEach(c => observer.observe(c));
</script>
